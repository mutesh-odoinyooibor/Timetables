<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Oldoinyo Oibor Timetables</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: letterhead (logo | school | logo), action bar, then timetable or registry (left) beside collisions + waiting room (right). */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --ink:#15211b; --muted:#56675e; --line:#d5dcd8;
  --accent:#1c6b4d; --accent-ink:#ffffff; --accent-soft:#e1f1e8;
  --bad:#b3261e; --bad-bg:#fde9e7; --warn:#80540a; --warn-bg:#fff1d2; --ok:#1c6b4d;
  --cs:58%; --cl:90%; --brk:#d9dcda; --focus:#0b57d0;
  --navy:#1b1c4f; --navy-ink:#ffffff; --red:#8e1b1b;
  --f-head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18211d; --ink:#e6eee9; --muted:#9db0a5; --line:#2b3a32;
  --accent:#58c698; --accent-ink:#0b1a13; --accent-soft:#16372a;
  --bad:#ff8f86; --bad-bg:#3c1b19; --warn:#f0c363; --warn-bg:#3a2d10; --ok:#58c698;
  --cs:34%; --cl:24%; --brk:#2c3631; --focus:#8ab4ff; --navy:#2b2d6e; --red:#ff9f94; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211d; --ink:#e6eee9; --muted:#9db0a5; --line:#2b3a32;
  --accent:#58c698; --accent-ink:#0b1a13; --accent-soft:#16372a;
  --bad:#ff8f86; --bad-bg:#3c1b19; --warn:#f0c363; --warn-bg:#3a2d10; --ok:#58c698;
  --cs:34%; --cl:24%; --brk:#2c3631; --focus:#8ab4ff; --navy:#2b2d6e; --red:#ff9f94; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* letterhead */
.head{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"l1 title l2";gap:16px 24px;align-items:center;
  padding:20px 0 18px;border-bottom:2px solid var(--ink)}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px;width:120px}
.logo.l1{grid-area:l1}.logo.l2{grid-area:l2}
.logo .frame{width:96px;height:96px;border:1.5px dashed var(--line);border-radius:50%;display:grid;place-items:center;overflow:hidden;
  color:var(--muted);font-size:12px;text-align:center;background:var(--surface)}
.logo .frame.has{border-style:solid}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.upl{position:relative;overflow:hidden;font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;white-space:nowrap}
.upl:hover{border-color:var(--accent);color:var(--accent)}
.upl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.upl:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.title{grid-area:title;text-align:center;min-width:0}
.title h1{font:700 clamp(20px,3.6vw,34px)/1.1 var(--f-head);letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
.title .addr{margin:6px 0 0;color:var(--muted)}
.title .motto{margin:2px 0 0;font-style:italic;font-weight:500}
.title input{margin-top:8px;text-align:center;border:1px solid transparent;border-radius:6px;background:transparent;padding:3px 8px;
  font:600 14px var(--f-body);width:min(260px,100%);color:var(--accent)}
.title input:hover,.title input:focus{border-color:var(--line);background:var(--surface)}

/* actions */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0 8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-weight:500;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
.chip.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chip.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.chip.ok{background:var(--accent-soft);border-color:var(--ok);color:var(--ok)}
.msg{min-height:22px;padding:2px 0 10px;color:var(--muted)}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}

/* layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:1000px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card h2{font:700 16px var(--f-head);margin:0 0 8px}
.side{display:grid;gap:16px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sub-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:baseline;margin:0 0 8px}
.sub-h strong{font:700 17px var(--f-head);letter-spacing:.01em}
.sub-h strong.red{color:var(--red);text-transform:uppercase}
.sub-h span{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}

/* timetable grid: days down the side, periods across, grey break columns */
table.tt{border-collapse:separate;border-spacing:3px;width:100%;min-width:900px;table-layout:fixed}
.tt th{font-weight:600}
.tt th.ph,.tt th.brkh{background:var(--navy);color:var(--navy-ink);font-size:14px;padding:5px 2px;text-align:center;line-height:1.15}
.tt th.ph small,.tt th.brkh small{display:block;font-size:10px;font-weight:500;opacity:.9}
.tt th.brkh{font-size:10px;letter-spacing:.04em;width:30px}
.tt th.dayh{width:76px;background:var(--navy)}
.tt th.dayc{width:76px;font-size:11px;letter-spacing:.03em;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.tt td.brkc{background:var(--brk);border-radius:4px;text-align:center;vertical-align:middle;padding:0}
.tt td.brkc span{writing-mode:vertical-rl;text-orientation:upright;font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--muted)}
.slot{height:64px;border-radius:5px;vertical-align:middle;position:relative;padding:4px 6px}
.slot.empty{background:var(--bg);border:1px dashed var(--line)}
.slot.empty.can{border:2px dashed var(--accent);background:var(--accent-soft);cursor:pointer}
.slot.empty.can:hover{background:var(--accent)}
.slot.lesson{background:hsl(var(--h) var(--cs) var(--cl));border:1px solid hsl(var(--h) 30% 55% / .45);text-align:center}
.slot .sub{font-weight:600;font-size:13px;line-height:1.2}
.slot .tch{font-size:12px;margin-top:1px;color:var(--ink);opacity:.8}
.slot .dbl{font-size:11px;opacity:.8}
.slot .x{position:absolute;top:1px;right:2px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:2px 4px;border-radius:4px;opacity:.5}
.slot:hover .x,.slot .x:focus-visible{opacity:1}
.slot .x:hover{color:var(--bad)}
.slot.bad{background:var(--bad-bg);border:2px solid var(--bad)}
.slot.bad .sub{color:var(--bad)}
.slot.flash{animation:flash 1.4s ease 1}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--focus)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.slot.flash{animation:none;box-shadow:0 0 0 3px var(--focus)}}
.legend{margin:8px 0 0;font-size:12px;color:var(--muted)}

/* side lists */
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.issue{border:1px solid var(--bad);background:var(--bad-bg);border-radius:8px;padding:8px 10px;font-size:13px;display:grid;gap:6px}
.issue .k{font-weight:700;color:var(--bad);font-size:11px;letter-spacing:.07em;text-transform:uppercase}
.empty-note{color:var(--muted);font-size:13px;margin:0}
.okbox{border:1px solid var(--ok);background:var(--accent-soft);color:var(--ok);border-radius:8px;padding:8px 10px;font-size:13px}
.wchip{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--warn);background:var(--warn-bg);
  border-radius:8px;padding:7px 10px;cursor:pointer}
.wchip[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft);border-color:var(--accent)}
.wchip b{font-size:13px;display:block}
.wchip small{color:var(--muted);font-size:12px}
.wchip .n{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}

/* setup + registry */
.setup h3{font:700 15px var(--f-head);margin:18px 0 6px}
.setup h3:first-child{margin-top:0}
.setup table{border-collapse:collapse;width:100%}
.setup th{font-size:12px;color:var(--muted);text-align:left;padding:4px 4px;font-weight:600}
.setup td{padding:3px 3px;vertical-align:middle}
.setup input[type=text],.setup input:not([type]),.setup select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);width:100%;min-width:0}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.times label{font-size:12px;color:var(--muted);display:grid;gap:2px}
.rules{margin:0;padding-left:18px;color:var(--muted)}
.rules li{margin:2px 0}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.fld{display:grid;gap:4px;font-weight:600;max-width:420px}
table.mx{min-width:640px}
table.mx th.c{text-align:center;width:62px}
table.mx td.c{text-align:center}
table.mx td.name{font-weight:600;min-width:150px}
table.mx input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
table.mx td.taken{text-align:center;font-size:12px;color:var(--muted);background:var(--brk);border-radius:4px}
table.mx td.quick{white-space:nowrap}
.q{border:1px solid var(--line);background:var(--bg);border-radius:5px;font-size:11px;padding:2px 6px;cursor:pointer;margin-right:2px}
.q:hover{border-color:var(--accent);color:var(--accent)}
table.cov td.c{text-align:center;border:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:13px}
table.cov td.none{background:var(--warn-bg);color:var(--warn)}
table.cov td.name{font-weight:600}
.tcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.tcard .th{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.tcard .no{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:24px;height:24px;display:inline-grid;place-items:center;font-weight:700;font-size:13px}
.tcard .ld{margin-left:auto;color:var(--muted);font-size:13px}
.tcard .ld.over{color:var(--bad);font-weight:600}
.tcard .tt-text{margin-top:6px;font-size:13px;overflow-wrap:anywhere}
.setup input[type=number]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);width:100%}
.tlist td.no{font-weight:700;width:48px;font-variant-numeric:tabular-nums}
.tlist .over{color:var(--bad);font-weight:600}
.edit-banner{background:var(--accent-soft);border:1px solid var(--ok);color:var(--ok);padding:6px 10px;border-radius:8px;font-size:13px;margin-bottom:8px}

.dlbar{margin:0 0 10px}
.sheet-wrap{overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#cfd4da;position:relative}
.sheet-scale{transform-origin:0 0;width:297mm}
.sheet-scale .sheet{margin:0;page-break-after:auto;break-after:auto}
@media (max-width:640px){
  .head{grid-template-columns:1fr 1fr;grid-template-areas:"l1 l2" "title title";justify-items:center;gap:14px}
  .logo{width:100%}
  .chips{margin-left:0}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="logo l1">
      <div class="frame" id="frame1">Logo 1</div>
      <label class="upl">Upload logo 1<input type="file" accept="image/*" id="file1"></label>
    </div>
    <div class="title">
      <h1>Oldoinyo Oibor Comprehensive School</h1>
      <p class="addr">P.O. Box 81-00209 Loitokitok</p>
      <p class="motto">Motto: “Knowledge is Power”</p>
      <input id="ttitle" aria-label="Year or term shown on the timetable" spellcheck="false">
    </div>
    <div class="logo l2">
      <div class="frame" id="frame2">Logo 2</div>
      <label class="upl">Upload logo 2<input type="file" accept="image/*" id="file2"></label>
    </div>
  </header>

  <div class="bar">
    <button class="btn primary" data-act="generate">Generate timetables</button>
    <button class="btn" data-act="detect">Detect collisions</button>
    <button class="btn" data-act="solve">Auto-solve collisions</button>
    <button class="btn" id="dlTop" data-act="dl" data-kind="master" hidden>Download master timetable</button>
    <div class="chips" id="chips"></div>
  </div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <div class="main">
    <section class="card" id="mainCard"></section>
    <aside class="side">
      <section class="card" id="issuesCard"></section>
      <section class="card" id="waitCard"></section>
    </aside>
  </div>
</div>
<script>
/* ===== Timetable engine (pure logic, no DOM) ===== */
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const NP=8;                       // teaching periods per day
const MAXLOAD=NP-2;               // a teacher teaches at most 6 periods a day, so keeps at least two free periods
const MORNING_LAST=5;             // P6 is the last period before lunch; Mathematics stays in the morning
function isMorning(a){const ar=typeof a==='string'?areaById(a):a;return !!ar&&(ar.morning===true||(ar.morning===undefined&&/math/i.test(ar.name||'')));}
function teacherLoad(d,t){if(!t) return 0;let n=0;for(const c of CLASSES)for(let p=0;p<NP;p++){const x=S.tt[c.k][d][p];if(x&&tOf(x,c.k)===t) n++;}return n;}
const DOUBLE_STARTS=[0,2,4,6];    // a double never crosses a break: pairs are P1-2, P3-4, P5-6, P7-8
const CLASSES=[7,8,9].flatMap(g=>['South','North'].map(s=>({k:g+s[0],g,s,label:'Grade '+g+' '+s,short:'G'+g+' '+s})));
const CORE=/english|kiswahili|math|science/i;
let S;

function uid(){return Math.random().toString(36).slice(2,9);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function emptyTT(){const t={};CLASSES.forEach(c=>{t[c.k]=DAYS.map(()=>Array(NP).fill(null));});return t;}
function clsOf(k){return CLASSES.find(c=>c.k===k);}
function areaById(id){return S.areas.find(a=>a.id===id);}

function defaultState(){
  const list=[['English','ENG','daily',5,30],['Kiswahili','KISW','daily',4,160],['Mathematics','MATH','daily',5,355],
    ['Integrated Science','SCI','double',5,125],['Agriculture','AGRI','double',4,230],['Pre-Technical Studies','PT/TECH','double',4,200],
    ['Social Studies','SST','daily',4,315],['Religious Education','CRE','daily',4,270],['Creative Arts & Sports','CAS','double',5,75]];
  const areas=list.map(([name,short,type,per,hue],i)=>({id:'a'+(i+1),name,short,type,per,hue}));
  const assign={};areas.forEach(a=>{assign[a.id]={};});
  return {areas,assign,teachers:[],nextNo:1,tt:emptyTT(),waiting:[],title:'Year 2026',
    times:['8:20-9:00','9:00-9:40','9:50-10:30','10:30-11:10','11:30-12:10','12:10-12:50','14:00-14:40','14:40-15:20'],
    btimes:['9:40-9:50','11:10-11:30','12:50-14:00']};
}

/* periods per week for a learning area. 'double' areas = one double + singles; 'daily' areas = singles on different days */
function perOf(a){
  let n=parseInt(a.per,10); if(isNaN(n)) n=a.type==='double'?2:5;
  return a.type==='double'?Math.max(2,Math.min(6,n)):Math.max(1,Math.min(5,n));
}
function teacherOf(a,cls){return String(((S.assign[a]||{})[cls])||'').trim();}
function tOf(cell,cls){return cell.hold?cell.t:teacherOf(cell.a,cls);}

function teacherFree(d,p,t,except){
  if(!t) return true;
  for(const c of CLASSES){
    if(c.k===except) continue;
    const x=S.tt[c.k][d][p];
    if(x&&tOf(x,c.k)===t) return false;
  }
  return true;
}
function blockerClass(d,p,t,except){
  for(const c of CLASSES){
    if(c.k===except) continue;
    const x=S.tt[c.k][d][p];
    if(x&&tOf(x,c.k)===t) return c.k;
  }
  return null;
}
function dayHas(cls,d,a){return S.tt[cls][d].some(x=>x&&x.a===a);}
function canSingle(cls,a,d,p){const t=teacherOf(a,cls);return !S.tt[cls][d][p]&&!dayHas(cls,d,a)&&(!isMorning(a)||p<=MORNING_LAST)&&teacherFree(d,p,t,cls)&&teacherLoad(d,t)+1<=MAXLOAD;}
function canDouble(cls,a,d,p){
  if(!DOUBLE_STARTS.includes(p)) return false;
  const t=teacherOf(a,cls);
  return !S.tt[cls][d][p]&&!S.tt[cls][d][p+1]&&!dayHas(cls,d,a)&&(!isMorning(a)||p+1<=MORNING_LAST)&&teacherFree(d,p,t,cls)&&teacherFree(d,p+1,t,cls)&&teacherLoad(d,t)+2<=MAXLOAD;
}
function putSingle(cls,a,d,p){S.tt[cls][d][p]={a,id:uid(),part:0,len:1};}
function putDouble(cls,a,d,p){const id=uid();S.tt[cls][d][p]={a,id,part:0,len:2};S.tt[cls][d][p+1]={a,id,part:1,len:2};}
function dayOrder(d){return [d].concat(shuffle([0,1,2,3,4].filter(x=>x!==d)));}

/* Score-based placement used while generating */
function placeScored(cls,a,kind,fixedDay){
  const area=areaById(a); if(!area) return false;
  const core=CORE.test(area.name);
  const days=fixedDay>=0?[fixedDay]:[0,1,2,3,4];
  const cands=[];
  for(const d of days){
    if(dayHas(cls,d,a)) continue;
    if(kind==='double'){
      const dblToday=S.tt[cls][d].filter(x=>x&&x.len===2&&x.part===0).length;
      for(const p of DOUBLE_STARTS) if(canDouble(cls,a,d,p)) cands.push({d,p,s:dblToday*3+Math.random()*2+p*(core?.3:.12)});
    }else{
      for(let p=0;p<NP;p++) if(canSingle(cls,a,d,p)){
        let same=0;for(let dd=0;dd<5;dd++){const x=S.tt[cls][dd][p];if(x&&x.a===a)same++;}
        cands.push({d,p,s:same*1.5+Math.random()*1.5+p*(core?.3:.12)});
      }
    }
  }
  if(!cands.length) return false;
  cands.sort((x,y)=>x.s-y.s);
  const b=cands[0];
  if(kind==='double') putDouble(cls,a,b.d,b.p); else putSingle(cls,a,b.d,b.p);
  return true;
}

/* Move a placed lesson (single or double) to another free valid position */
function moveLesson(cls,d,p){
  const cell=S.tt[cls][d][p];
  if(!cell||cell.hold) return false;
  const a=cell.a;
  if(cell.len!==2){
    S.tt[cls][d][p]=null;
    for(const dd of dayOrder(d)) for(const pp of shuffle([...Array(NP).keys()])){
      if(dd===d&&pp===p) continue;
      if(canSingle(cls,a,dd,pp)){putSingle(cls,a,dd,pp);return true;}
    }
    S.tt[cls][d][p]=cell;return false;
  }
  const p0=cell.part===0?p:p-1;
  const c0=S.tt[cls][d][p0],c1=S.tt[cls][d][p0+1];
  S.tt[cls][d][p0]=null;S.tt[cls][d][p0+1]=null;
  for(const dd of dayOrder(d)) for(const pp of shuffle(DOUBLE_STARTS)){
    if(dd===d&&pp===p0) continue;
    if(canDouble(cls,a,dd,pp)){putDouble(cls,a,dd,pp);return true;}
  }
  S.tt[cls][d][p0]=c0;S.tt[cls][d][p0+1]=c1;return false;
}

/* Free the needed slots by relocating whatever blocks them (own class or the teacher's other class) */
function clearFor(cls,d,need,t){
  for(let pass=0;pass<3;pass++){
    for(const q of need){
      const cur=S.tt[cls][d][q];
      if(cur&&!cur.hold&&!moveLesson(cls,d,q)) return false;
      if(!S.tt[cls][d][q]) S.tt[cls][d][q]={hold:true,a:'__hold',t};
      let guard=0;
      while(!teacherFree(d,q,t,cls)){
        if(guard++>8) return false;
        const c2=blockerClass(d,q,t,cls);
        if(!c2||!moveLesson(c2,d,q)) return false;
      }
    }
  }
  return need.every(q=>S.tt[cls][d][q]&&S.tt[cls][d][q].hold&&teacherFree(d,q,t,cls));
}
function augment(cls,a,kind,fixedDay){
  const t=teacherOf(a,cls);
  const days=fixedDay>=0?[fixedDay]:shuffle([0,1,2,3,4]);
  for(const d of days){
    if(dayHas(cls,d,a)) continue;
    if(teacherLoad(d,t)+(kind==='double'?2:1)>MAXLOAD) continue;
    const starts=(kind==='double'?shuffle(DOUBLE_STARTS):shuffle([...Array(NP).keys()])).filter(p=>!isMorning(a)||p+(kind==='double'?1:0)<=MORNING_LAST);
    for(const p of starts){
      const need=kind==='double'?[p,p+1]:[p];
      const snap=JSON.stringify(S.tt);
      if(clearFor(cls,d,need,t)){
        need.forEach(q=>{S.tt[cls][d][q]=null;});
        if(kind==='double') putDouble(cls,a,d,p); else putSingle(cls,a,d,p);
        return true;
      }
      S.tt=JSON.parse(snap);
    }
  }
  return false;
}

function solveWaiting(){
  let progress=true,guard=0;
  while(progress&&guard++<25){
    progress=false;
    for(const it of S.waiting.slice()){
      if(!areaById(it.a)){S.waiting=S.waiting.filter(x=>x.id!==it.id);continue;}
      const ok=placeScored(it.cls,it.a,it.kind,it.day)||placeScored(it.cls,it.a,it.kind,-1)||
               augment(it.cls,it.a,it.kind,it.day)||augment(it.cls,it.a,it.kind,-1);
      if(ok){S.waiting=S.waiting.filter(x=>x.id!==it.id);progress=true;}
    }
  }
}

function generateGreedy(){
  let best=null;const t0=Date.now();
  for(let n=0;n<60;n++){
    if(best&&Date.now()-t0>3000) break;
    S.tt=emptyTT();S.waiting=[];
    const dbl=[],sgl=[],dly=[];
    S.areas.forEach(a=>CLASSES.forEach(c=>{
      const n=perOf(a);
      if(a.type==='double'){dbl.push({cls:c.k,a:a.id});for(let i=0;i<n-2;i++) sgl.push({cls:c.k,a:a.id,day:-1});}
      else for(let i=0;i<n;i++){(n===5?dly:sgl).push({cls:c.k,a:a.id,day:n===5?i:-1});}
    }));
    shuffle(dbl).forEach(x=>{if(!placeScored(x.cls,x.a,'double',-1)) S.waiting.push({id:uid(),cls:x.cls,a:x.a,kind:'double',day:-1});});
    shuffle(dly).concat(shuffle(sgl)).forEach(x=>{if(!placeScored(x.cls,x.a,'daily',x.day)&&!placeScored(x.cls,x.a,'daily',-1)) S.waiting.push({id:uid(),cls:x.cls,a:x.a,kind:'daily',day:x.day});});
    solveWaiting();
    if(!best||S.waiting.length<best.w.length) best={tt:JSON.stringify(S.tt),w:S.waiting.slice()};
    if(S.waiting.length===0) break;
  }
  S.tt=JSON.parse(best.tt);S.waiting=best.w;
  S.generatedAt=new Date().toISOString();S.updatedAt=null;
}

/* Keep grid + waiting room consistent with the learning-area list */
function syncWaiting(){
  const ids=new Set(S.areas.map(a=>a.id));
  CLASSES.forEach(c=>DAYS.forEach((_,d)=>{for(let p=0;p<NP;p++){const x=S.tt[c.k][d][p];if(x&&!x.hold&&!ids.has(x.a))S.tt[c.k][d][p]=null;}}));
  S.waiting=S.waiting.filter(w=>ids.has(w.a));
  CLASSES.forEach(c=>S.areas.forEach(a=>{
    const ed=a.type==='double'?1:0, es=perOf(a)-ed*2;
    const seen=new Set();let pd=0,ps=0;
    for(let d=0;d<5;d++)for(let p=0;p<NP;p++){const x=S.tt[c.k][d][p];if(x&&!x.hold&&x.a===a.id&&!seen.has(x.id)){seen.add(x.id);if(x.len===2)pd++;else ps++;}}
    [['double',ed,pd],['daily',es,ps]].forEach(([kind,exp,placed])=>{
      const wl=S.waiting.filter(w=>w.cls===c.k&&w.a===a.id&&w.kind===kind);
      const total=placed+wl.length;
      if(total<exp) for(let i=0;i<exp-total;i++) S.waiting.push({id:uid(),cls:c.k,a:a.id,kind,day:-1});
      else if(total>exp) wl.slice(0,total-exp).forEach(w=>{S.waiting=S.waiting.filter(x=>x.id!==w.id);});
    });
  }));
}

function detect(){
  const issues=[];
  for(let d=0;d<5;d++)for(let p=0;p<NP;p++){
    const m={};
    CLASSES.forEach(c=>{const x=S.tt[c.k][d][p];if(x&&!x.hold){const t=tOf(x,c.k);if(t)(m[t]=m[t]||[]).push(c.k);}});
    Object.keys(m).forEach(t=>{if(m[t].length>1) issues.push({type:'teacher',teacher:t,d,p,classes:m[t],cells:m[t].map(k=>({cls:k,d,p}))});});
  }
  CLASSES.forEach(c=>{
    for(let d=0;d<5;d++){
      const byArea={};
      for(let p=0;p<NP;p++){
        const x=S.tt[c.k][d][p];
        if(!x||x.hold) continue;
        (byArea[x.a]=byArea[x.a]||{ids:new Set(),cells:[]});byArea[x.a].ids.add(x.id);byArea[x.a].cells.push({cls:c.k,d,p});
      }
      Object.keys(byArea).forEach(a=>{if(byArea[a].ids.size>1) issues.push({type:'repeat',cls:c.k,d,a,cells:byArea[a].cells});});
      for(let p=0;p<NP;p++){
        const x=S.tt[c.k][d][p];
        if(!x||x.hold||x.len!==2) continue;
        const n=S.tt[c.k][d][p+1],pr=S.tt[c.k][d][p-1];
        let bad=false;
        if(x.part===0){bad=!(n&&n.id===x.id&&n.part===1)||!DOUBLE_STARTS.includes(p);}
        else bad=!(pr&&pr.id===x.id&&pr.part===0);
        if(bad) issues.push({type:'broken',cls:c.k,d,a:x.a,cells:[{cls:c.k,d,p}]});
      }
    }
  });
  S.teachers.forEach(t=>{for(let d=0;d<5;d++){
    const cells=[];CLASSES.forEach(c=>{for(let p=0;p<NP;p++){const x=S.tt[c.k][d][p];if(x&&!x.hold&&tOf(x,c.k)===t.id) cells.push({cls:c.k,d,p});}});
    if(cells.length>MAXLOAD) issues.push({type:'load',teacher:t.id,d,n:cells.length,cells});
  }});
  CLASSES.forEach(c=>{for(let d=0;d<5;d++)for(let p=MORNING_LAST+1;p<NP;p++){const x=S.tt[c.k][d][p];if(x&&!x.hold&&isMorning(x.a)) issues.push({type:'morning',cls:c.k,d,a:x.a,cells:[{cls:c.k,d,p}]});}});
  return issues;
}

function dropToWaiting(cls,d,p){
  const x=S.tt[cls][d][p];if(!x||x.hold) return;
  if(x.len===2){
    for(let q=0;q<NP;q++){const y=S.tt[cls][d][q];if(y&&y.id===x.id)S.tt[cls][d][q]=null;}
    S.waiting.push({id:uid(),cls,a:x.a,kind:'double',day:-1});
  }else{
    S.tt[cls][d][p]=null;
    S.waiting.push({id:uid(),cls,a:x.a,kind:'daily',day:d});
  }
}

function autoSolveGreedy(){
  const log={moved:0,dropped:0,placed:0,before:0,after:0};
  syncWaiting();
  log.before=detect().length;
  const w0=S.waiting.length;
  for(let iter=0;iter<60;iter++){
    const issues=detect();
    if(!issues.length) break;
    const is=issues[0];
    if(is.type==='teacher'){
      for(const cell of is.cells.slice(1)){
        const x=S.tt[cell.cls][cell.d][cell.p];if(!x) continue;
        if(teacherFree(cell.d,cell.p,tOf(x,cell.cls),cell.cls)) continue;
        if(moveLesson(cell.cls,cell.d,cell.p)) log.moved++;
        else{dropToWaiting(cell.cls,cell.d,cell.p);log.dropped++;}
      }
    }else if(is.type==='repeat'){
      const ids=[];is.cells.forEach(c=>{const x=S.tt[c.cls][c.d][c.p];if(x&&!ids.includes(x.id))ids.push(x.id);});
      const extra=is.cells.find(c=>S.tt[c.cls][c.d][c.p].id===ids[1]);
      if(moveLesson(extra.cls,extra.d,extra.p)) log.moved++;
      else{dropToWaiting(extra.cls,extra.d,extra.p);log.dropped++;}
    }else if(is.type==='morning'){
      const c=is.cells[0];
      if(moveLesson(c.cls,c.d,c.p)) log.moved++; else{dropToWaiting(c.cls,c.d,c.p);log.dropped++;}
    }else if(is.type==='load'){
      let over=is.n-MAXLOAD;const seen=new Set();
      for(const c of is.cells.slice().reverse()){
        if(over<=0) break;
        const x=S.tt[c.cls][c.d][c.p];if(!x||seen.has(x.id)) continue;seen.add(x.id);
        const len=x.len===2?2:1;
        if(moveLesson(c.cls,c.d,c.p)) log.moved++; else{dropToWaiting(c.cls,c.d,c.p);log.dropped++;}
        over-=len;
      }
    }else{
      const c=is.cells[0];
      const x=S.tt[c.cls][c.d][c.p];
      if(x){ // remove every piece of this broken lesson and queue one lesson
        for(let q=0;q<NP;q++){const y=S.tt[c.cls][c.d][q];if(y&&y.id===x.id)S.tt[c.cls][c.d][q]=null;}
        S.waiting.push({id:uid(),cls:c.cls,a:x.a,kind:x.len===2?'double':'daily',day:-1});log.dropped++;
      }
    }
  }
  syncWaiting();
  const wMid=S.waiting.length;
  solveWaiting();
  log.placed=Math.max(0,wMid-S.waiting.length);
  log.after=detect().length;
  log.waitingNow=S.waiting.length;
  return log;
}

/* ===== Solver: every class keeps a valid full grid, then annealing removes teacher clashes and overloads ===== */
function solveAll(keep,budgetMs){
  budgetMs=budgetMs||6000;
  const t0=Date.now(),NC=CLASSES.length,R=n=>Math.floor(Math.random()*n);
  if(keep) syncWaiting();
  const tid={};let T=0;
  const idxOf=id=>{if(!id) return -1;if(tid[id]===undefined) tid[id]=T++;return tid[id];};
  const TO={},morning={};
  S.areas.forEach(a=>{TO[a.id]={};morning[a.id]=isMorning(a);CLASSES.forEach(c=>{TO[a.id][c.k]=idxOf(teacherOf(a.id,c.k));});});
  const baseTT=keep?JSON.parse(JSON.stringify(S.tt)):null;
  const baseWait=keep?S.waiting.map(w=>({cls:w.cls,a:w.a,len:w.kind==='double'?2:1})):null;
  function allUnits(){
    const u={};CLASSES.forEach(c=>{u[c.k]=[];});
    S.areas.forEach(a=>CLASSES.forEach(c=>{
      const n=perOf(a);
      if(a.type==='double'){u[c.k].push({a:a.id,len:2});for(let i=0;i<n-2;i++) u[c.k].push({a:a.id,len:1});}
      else for(let i=0;i<n;i++) u[c.k].push({a:a.id,len:1});
    }));return u;
  }
  let bestSnap=null;
  function attempt(slice){
    const G={};CLASSES.forEach(c=>{G[c.k]=baseTT?JSON.parse(JSON.stringify(baseTT[c.k])):DAYS.map(()=>Array(NP).fill(null));});
    const occ=new Int16Array(Math.max(1,T)*5*NP),load=new Int16Array(Math.max(1,T)*5);let cost=0;
    const G2=CLASSES.map(c=>G[c.k]);
    function inc(t,d,p){const k=(t*5+d)*NP+p;if(occ[k]++>=1) cost++;if(load[t*5+d]++>=MAXLOAD) cost++;}
    function dec(t,d,p){const k=(t*5+d)*NP+p;if(--occ[k]>=1) cost--;if(--load[t*5+d]>=MAXLOAD) cost--;}
    function tOfCell(ci,cell){const m=TO[cell.a];return m?m[CLASSES[ci].k]:-1;}
    function setCell(ci,d,p,cell){
      const g=G2[ci],old=g[d][p];
      if(old){const t=tOfCell(ci,old);if(t>=0) dec(t,d,p);}
      g[d][p]=cell;
      if(cell){const t=tOfCell(ci,cell);if(t>=0) inc(t,d,p);}
    }
    // units still to place
    const U=CLASSES.map(()=>[]);
    if(keep) baseWait.forEach(w=>{const ci=CLASSES.findIndex(c=>c.k===w.cls);if(ci>=0&&TO[w.a]) U[ci].push({a:w.a,len:w.len});});
    else{const all=allUnits();CLASSES.forEach((c,ci)=>{U[ci]=all[c.k];});}
    // clean the kept timetable: remove holds, repeats in a day, Mathematics after lunch and broken doubles (they are placed again below)
    for(let ci=0;ci<NC;ci++)for(let d=0;d<5;d++){
      const g=G2[ci][d],seen={};
      const kill=p=>{const x=g[p];if(!x) return;if(x.len===2){const p0=x.part===0?p:p-1;U[ci].push({a:x.a,len:2});if(g[p0]&&g[p0].id===x.id) g[p0]=null;if(g[p0+1]&&g[p0+1].id===x.id) g[p0+1]=null;}else{U[ci].push({a:x.a,len:1});g[p]=null;}};
      for(let p=0;p<NP;p++){
        const x=g[p];if(!x) continue;
        if(x.hold||!TO[x.a]){g[p]=null;continue;}
        if(x.len===2){
          const ok=x.part===0?(DOUBLE_STARTS.includes(p)&&g[p+1]&&g[p+1].id===x.id&&g[p+1].part===1):(g[p-1]&&g[p-1].id===x.id&&g[p-1].part===0);
          if(!ok){g[p]=null;U[ci].push({a:x.a,len:2});continue;}
        }
        if(seen[x.a]!==undefined&&seen[x.a]!==x.id){kill(p);continue;}
        if(morning[x.a]&&p>MORNING_LAST){kill(p);continue;}
        seen[x.a]=x.id;
      }
    }
    // count what stays placed
    for(let ci=0;ci<NC;ci++)for(let d=0;d<5;d++)for(let p=0;p<NP;p++){
      const x=G2[ci][d][p];if(!x) continue;
      const t=tOfCell(ci,x);if(t>=0) inc(t,d,p);
    }
    const loose=[];
    function dayHasA(g,d,a){for(let p=0;p<NP;p++){const x=g[d][p];if(x&&x.a===a) return true;}return false;}
    function placeUnit(ci,u,added){
      const g=G2[ci],cands=[];
      for(let d=0;d<5;d++){
        if(dayHasA(g,d,u.a)) continue;
        const starts=u.len===2?DOUBLE_STARTS:[0,1,2,3,4,5,6,7];
        for(const p of starts){
          if(g[d][p]||(u.len===2&&g[d][p+1])) continue;
          if(morning[u.a]&&p+u.len-1>MORNING_LAST) continue;
          const t=TO[u.a][CLASSES[ci].k];let s=Math.random()*2;
          if(t>=0){for(let q=0;q<u.len;q++){if(occ[(t*5+d)*NP+p+q]>0) s+=10;}if(load[t*5+d]+u.len>MAXLOAD) s+=10;}
          cands.push([s,d,p]);
        }
      }
      if(!cands.length) return false;
      cands.sort((x,y)=>x[0]-y[0]);const [,d,p]=cands[0],id=uid();
      if(u.len===2){setCell(ci,d,p,{a:u.a,id,part:0,len:2});setCell(ci,d,p+1,{a:u.a,id,part:1,len:2});added.push([d,p],[d,p+1]);}
      else{setCell(ci,d,p,{a:u.a,id,part:0,len:1});added.push([d,p]);}
      return true;
    }
    for(let ci=0;ci<NC;ci++){
      const base=U[ci].slice();let bestMiss=null;
      for(let tr=0;tr<(keep?10:40);tr++){
        const order=base.filter(u=>u.len===2).sort(()=>Math.random()-.5)
          .concat(base.filter(u=>u.len===1&&morning[u.a]).sort(()=>Math.random()-.5))
          .concat(base.filter(u=>u.len===1&&!morning[u.a]).sort(()=>Math.random()-.5));
        const added=[],miss=[];
        order.forEach(u=>{if(!placeUnit(ci,u,added)) miss.push(u);});
        if(!bestMiss||miss.length<bestMiss.length) bestMiss=miss;
        if(!miss.length) break;
        added.forEach(([d,p])=>setCell(ci,d,p,null));
        if(tr===(keep?10:40)-1){ // last try failed: keep the final partial layout
          const added2=[],miss2=[];order.forEach(u=>{if(!placeUnit(ci,u,added2)) miss2.push(u);});bestMiss=miss2;
        }
      }
      (bestMiss||[]).forEach(u=>loose.push({ci,a:u.a,len:u.len}));
    }
    // validity of one day of one class
    function validDay(ci,d){
      const g=G2[ci][d],seen={};
      for(let p=0;p<NP;p++){const x=g[p];if(!x) continue;
        if(seen[x.a]!==undefined&&seen[x.a]!==x.id) return false;seen[x.a]=x.id;
        if(morning[x.a]&&p>MORNING_LAST) return false;}
      return true;
    }
    function swapCells(ci,d1,p1,d2,p2){const g=G2[ci],a=g[d1][p1],b=g[d2][p2];setCell(ci,d1,p1,b);setCell(ci,d2,p2,a);}
    function anneal(ms){
      const s0=Date.now();let it=0,Tm=.6;
      while(cost>0){
        if((it++&511)===0){const el=Date.now()-s0;if(el>ms) break;Tm=(.55*(1-el/ms)+.06)*(keep?.4:1);}
        const ci=R(NC),g=G2[ci];let d1=R(5),p1=R(NP);
        if(R(100)<85){for(let k=0;k<30;k++){const dd=R(5),pp=R(NP),ce=g[dd][pp];
          if(ce){const t=tOfCell(ci,ce);if(t>=0&&(occ[(t*5+dd)*NP+pp]>1||load[t*5+dd]>MAXLOAD)){d1=dd;p1=pp;break;}}}}
        const c1=g[d1][p1],before=cost;let pair;
        if((c1&&c1.len===2)||R(100)<25){
          pair=true;const q1=p1&~1,d2=R(5),q2=R(NP/2)*2;
          if(d2===d1&&q2===q1) continue;
          swapCells(ci,d1,q1,d2,q2);swapCells(ci,d1,q1+1,d2,q2+1);
          if(validDay(ci,d1)&&validDay(ci,d2)&&(cost<=before||Math.random()<Math.exp(-(cost-before)/Tm))) continue;
          swapCells(ci,d1,q1+1,d2,q2+1);swapCells(ci,d1,q1,d2,q2);
        }else{
          const d2=R(5),p2=R(NP),c2=g[d2][p2];
          if(c2&&c2.len===2) continue;
          if(!c1&&!c2) continue;
          if(d1===d2&&p1===p2) continue;
          swapCells(ci,d1,p1,d2,p2);
          if(validDay(ci,d1)&&validDay(ci,d2)&&(cost<=before||Math.random()<Math.exp(-(cost-before)/Tm))) continue;
          swapCells(ci,d1,p1,d2,p2);
        }
      }
    }
    anneal(slice);
    // anything still clashing or overloaded goes to the waiting list
    function dropUnit(ci,d,p){
      const x=G2[ci][d][p];if(!x) return;
      if(x.len===2){const p0=x.part===0?p:p-1;setCell(ci,d,p0,null);setCell(ci,d,p0+1,null);loose.push({ci,a:x.a,len:2});}
      else{setCell(ci,d,p,null);loose.push({ci,a:x.a,len:1});}
    }
    if(cost>0){
      const cells=[];for(let ci=0;ci<NC;ci++)for(let d=0;d<5;d++)for(let p=0;p<NP;p++) cells.push([ci,d,p]);
      cells.sort(()=>Math.random()-.5);
      cells.forEach(([ci,d,p])=>{const x=G2[ci][d][p];if(!x) return;const t=tOfCell(ci,x);if(t>=0&&occ[(t*5+d)*NP+p]>1) dropUnit(ci,d,p);});
      cells.forEach(([ci,d,p])=>{const x=G2[ci][d][p];if(!x) return;const t=tOfCell(ci,x);if(t>=0&&load[t*5+d]>MAXLOAD) dropUnit(ci,d,p);});
    }
    CLASSES.forEach((c,ci)=>{S.tt[c.k]=G2[ci];});
    S.waiting=loose.map(l=>({id:uid(),cls:CLASSES[l.ci].k,a:l.a,kind:l.len===2?'double':'daily',day:-1}));
    solveWaiting();
    return S.waiting.length;
  }
  let tries=0;
  while(true){
    tries++;
    const left=budgetMs-(Date.now()-t0);
    const w=attempt(Math.max(400,Math.min(2500,left)));
    if(!bestSnap||w<bestSnap.w) bestSnap={w,tt:JSON.stringify(S.tt),wait:JSON.stringify(S.waiting)};
    if(w===0||Date.now()-t0>budgetMs) break;
  }
  S.tt=JSON.parse(bestSnap.tt);S.waiting=JSON.parse(bestSnap.wait);
  return {waiting:S.waiting.length,tries,ms:Date.now()-t0};
}

/* Reasons why a full timetable may be impossible with the current teacher allocation */
function diagnose(){
  const out=[];
  const per={};
  S.areas.forEach(a=>CLASSES.forEach(c=>{const t=teacherOf(a.id,c.k);if(t) per[t]=(per[t]||0)+perOf(a);}));
  Object.keys(per).forEach(t=>{if(per[t]>MAXLOAD*5){const tc=S.teachers.find(x=>x.id===t);out.push((tc?tc.name:'A teacher')+' has '+per[t]+' periods a week; the most possible is '+(MAXLOAD*5)+' (6 a day, keeping two free periods).');}});
  CLASSES.forEach(c=>{const n=S.areas.reduce((s,a)=>s+perOf(a),0);if(n>NP*5) out.push(c.label+' has '+n+' periods a week but only '+(NP*5)+' fit.');});
  return out;
}

function generate(){
  let r;
  try{r=solveAll(false,diagnose().length?1500:6000);}catch(err){generateGreedy();return;}
  S.generatedAt=new Date().toISOString();S.updatedAt=null;return r;
}
function autoSolve(){
  const log={moved:0,dropped:0,placed:0,before:0,after:0};
  syncWaiting();
  log.before=detect().length;
  const w0=S.waiting.length;
  const snap={};CLASSES.forEach(c=>S.tt[c.k].forEach((day,d)=>day.forEach((x,p)=>{if(x&&!x.hold&&x.part===0) snap[c.k+d+p]=x.a;})));
  try{solveAll(true,diagnose().length?1500:6000);}catch(err){return autoSolveGreedy();}
  syncWaiting();
  let moved=0;CLASSES.forEach(c=>S.tt[c.k].forEach((day,d)=>day.forEach((x,p)=>{if(x&&!x.hold&&x.part===0&&snap[c.k+d+p]!==x.a) moved++;})));
  log.moved=moved;log.after=detect().length;log.waitingNow=S.waiting.length;
  log.placed=Math.max(0,w0-S.waiting.length);log.dropped=Math.max(0,S.waiting.length-w0);
  return log;
}

/* ===== QR code encoder (byte mode, error correction L or M, versions 1-40) ===== */
const QR=(function(){
  const ECC={L:[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
             M:[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28]};
  const BLK={L:[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
             M:[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]};
  const FMT={L:1,M:0};
  function rawModules(v){let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36;}return r;}
  function dataCw(v,e){return Math.floor(rawModules(v)/8)-ECC[e][v]*BLK[e][v];}
  function alignPos(v){
    if(v===1) return [];
    const n=Math.floor(v/7)+2, step=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2, res=[6];
    for(let pos=v*4+10;res.length<n;pos-=step) res.splice(1,0,pos);
    return res;
  }
  function gmul(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z;}
  function rsDiv(deg){
    const r=new Array(deg).fill(0);r[deg-1]=1;let root=1;
    for(let i=0;i<deg;i++){for(let j=0;j<deg;j++){r[j]=gmul(r[j],root);if(j+1<deg) r[j]^=r[j+1];}root=gmul(root,2);}
    return r;
  }
  function rsRem(data,div){
    const r=new Array(div.length).fill(0);
    data.forEach(b=>{const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=gmul(c,f);});});
    return r;
  }
  function utf8(s){
    if(typeof TextEncoder!=='undefined') return Array.from(new TextEncoder().encode(s));
    return Array.from(unescape(encodeURIComponent(s))).map(c=>c.charCodeAt(0));
  }
  function make(text,level){
    const e=level||'L', bytes=utf8(text);
    let ver=1;
    for(;;ver++){
      if(ver>40) throw new Error('too long');
      if(4+(ver<=9?8:16)+bytes.length*8<=dataCw(ver,e)*8) break;
    }
    const cap=dataCw(ver,e)*8, bits=[];
    const put=(val,len)=>{for(let i=len-1;i>=0;i--) bits.push((val>>>i)&1);};
    put(4,4);put(bytes.length,ver<=9?8:16);bytes.forEach(b=>put(b,8));
    put(0,Math.min(4,cap-bits.length));
    while(bits.length%8) bits.push(0);
    for(let pad=0xEC;bits.length<cap;pad^=0xEC^0x11) put(pad,8);
    const cw=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++) b=(b<<1)|bits[i+j];cw.push(b);}
    // error correction and interleaving
    const nb=BLK[e][ver], eccLen=ECC[e][ver], raw=Math.floor(rawModules(ver)/8);
    const nShort=nb-raw%nb, shortLen=Math.floor(raw/nb), div=rsDiv(eccLen), blocks=[];
    for(let i=0,k=0;i<nb;i++){
      const dat=cw.slice(k,k+shortLen-eccLen+(i<nShort?0:1));k+=dat.length;
      const ecc=rsRem(dat,div);
      if(i<nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const all=[];
    for(let i=0;i<blocks[0].length;i++) blocks.forEach((b,j)=>{if(i!==shortLen-eccLen||j>=nShort) all.push(b[i]);});
    // matrix
    const size=ver*4+17, M=[], F=[];
    for(let i=0;i<size;i++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false));}
    const setF=(x,y,d)=>{M[y][x]=d;F[y][x]=true;};
    for(let i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0);}
    const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
      const x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size) setF(x,y,Math.max(Math.abs(dx),Math.abs(dy))!==2&&Math.max(Math.abs(dx),Math.abs(dy))!==4);}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    const ap=alignPos(ver);
    ap.forEach((px,i)=>ap.forEach((py,j)=>{
      if((i===0&&j===0)||(i===0&&j===ap.length-1)||(i===ap.length-1&&j===0)) return;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++) setF(px+dx,py+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);
    }));
    const drawFormat=mask=>{
      const data=(FMT[e]<<3)|mask;let rem=data;
      for(let i=0;i<10;i++) rem=(rem<<1)^((rem>>>9)*0x537);
      const b=((data<<10)|rem)^0x5412, bit=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++) setF(8,i,bit(i));
      setF(8,7,bit(6));setF(8,8,bit(7));setF(7,8,bit(8));
      for(let i=9;i<15;i++) setF(14-i,8,bit(i));
      for(let i=0;i<8;i++) setF(size-1-i,8,bit(i));
      for(let i=8;i<15;i++) setF(8,size-15+i,bit(i));
      setF(8,size-8,true);
    };
    drawFormat(0);
    if(ver>=7){
      let rem=ver;for(let i=0;i<12;i++) rem=(rem<<1)^((rem>>>11)*0x1F25);
      const b=(ver<<12)|rem;
      for(let i=0;i<18;i++){const bit=((b>>>i)&1)!==0,a=size-11+i%3,c=Math.floor(i/3);setF(a,c,bit);setF(c,a,bit);}
    }
    // place data
    let idx=0;
    for(let right=size-1;right>=1;right-=2){
      if(right===6) right=5;
      for(let vert=0;vert<size;vert++) for(let j=0;j<2;j++){
        const x=right-j, up=((right+1)&2)===0, y=up?size-1-vert:vert;
        if(!F[y][x]&&idx<all.length*8){M[y][x]=((all[idx>>>3]>>>(7-(idx&7)))&1)!==0;idx++;}
      }
    }
    const maskFn=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,
      (x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,
      (x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const applyMask=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++) if(!F[y][x]&&maskFn[m](x,y)) M[y][x]=!M[y][x];};
    const penalty=()=>{
      let p=0;const rows=[],cols=[];
      for(let y=0;y<size;y++){let s='',t='';for(let x=0;x<size;x++){s+=M[y][x]?'1':'0';t+=M[x][y]?'1':'0';}rows.push(s);cols.push(t);}
      rows.concat(cols).forEach(s=>{
        const runs=s.match(/0+|1+/g)||[];runs.forEach(r=>{if(r.length>=5) p+=3+(r.length-5);});
        p+=40*((s.match(/(?=10111010000)/g)||[]).length+(s.match(/(?=00001011101)/g)||[]).length);
      });
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1]) p+=3;}
      let dark=0;M.forEach(r=>r.forEach(v=>{if(v) dark++;}));
      p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;
      return p;
    };
    let best=0,bestP=Infinity;
    for(let m=0;m<8;m++){applyMask(m);drawFormat(m);const p=penalty();if(p<bestP){bestP=p;best=m;}applyMask(m);}
    applyMask(best);drawFormat(best);
    return {size,version:ver,dark:(x,y)=>M[y][x]};
  }
  function svg(text,level,quiet){
    const q=make(text,level), z=quiet==null?3:quiet, n=q.size+z*2;
    let d='';
    for(let y=0;y<q.size;y++){let x=0;while(x<q.size){if(q.dark(x,y)){let w=1;while(x+w<q.size&&q.dark(x+w,y)) w++;d+='M'+(x+z)+' '+(y+z)+'h'+w+'v1h-'+w+'z';x+=w;}else x++;}}
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges"><rect width="'+n+'" height="'+n+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
  }
  return {make,svg};
})();

function qrTeacher(tid){

function qrMaster(){

  s+='TEACHERS: '+sortedTeachers().map(t=>t.no.toString(36)+'='+ascii(t.name)).join('; ')+'\n';
  CLASSES.forEach(c=>{
    s+=c.short.toUpperCase().replace(' ','')+'\n';
    for(let d=0;d<5;d++){

      }

function renderLogos(){

function handleLogo(n,file,done){
  const fin=()=>{try{if(done) done();}catch(e){}};
  if(!file){fin();return;}
  if(!/^image\//.test(file.type||'')&&!/\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i.test(file.name||'')){say('Please choose an image file, such as a PNG or JPG.','bad');fin();return;}
  const keep=(url,msg)=>{logos[n]=url;save();renderLogos();say(msg||('Logo '+n+' updated.'),'ok');fin();};
  const rd=new FileReader();
  rd.onerror=()=>{say('The file could not be read. Pick the image again.','bad');fin();};
  rd.onload=()=>{
    const url=String(rd.result||'');
    if(!/^data:image\//.test(url)){say('That file is not a readable image. Try a PNG or JPG.','bad');fin();return;}
    const img=new Image();
    img.onload=()=>{
      try{
        const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(!w||!h) throw new Error('size');
        const m=Math.min(1,320/Math.max(w,h));
        const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*m));cv.height=Math.max(1,Math.round(h*m));
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        keep(cv.toDataURL('image/png'));
      }catch(e){keep(url);}
    };
    img.onerror=()=>{say('That image could not be opened. Try a PNG or JPG.','bad');fin();};
    img.src=url;
  };
  rd.readAsDataURL(file);
}

function classCell(cls,d,p,bad){
  const c=S.tt[cls][d][p];

  if(c.len===2&&c.part===1){const left=S.tt[cls][d][p-1];if(left&&left.id===c.id&&left.part===0) return '';}
  const a=areaById(c.a);if(!a) return '<td class="slot empty"></td>';

  const span=c.len===2&&c.part===0&&S.tt[cls][d][p+1]&&S.tt[cls][d][p+1].id===c.id;
  const isBad=bad.has(cls+'|'+d+'|'+p)||(span&&bad.has(cls+'|'+d+'|'+(p+1)));
  return '<td class="slot lesson'+(isBad?' bad':'')+'" data-key="'+cls+'|'+d+'|'+p+'" style="--h:'+hue(c.a)+'"'+(span?' colspan="2"':'')+' title="'+esc(a.name+(t?' · '+tName(t):''))+'">'+

}
function fitSheets(){
  document.querySelectorAll('.sheet-wrap').forEach(w=>{
    const s=w.firstElementChild,sheet=s&&s.firstElementChild;if(!sheet) return;
    const sc=Math.min(1,w.clientWidth/sheet.offsetWidth);
    s.style.transform='scale('+sc+')';w.style.height=Math.ceil(sheet.offsetHeight*sc)+'px';
  });
}
function renderBar(){const b=$('dlTop');if(b) b.hidden=false;}
function touch(){S.updatedAt=new Date().toISOString();}
function doDownload(kind,arg){
  let out;
  try{out=buildExport(kind,arg);}catch(e){say('The file could not be built: '+(e&&e.message||e),'bad');return;}
  dl.save({filename:out.name,data:out.html}).then(()=>{
    say('Saved '+out.name+' ('+out.pages+' page'+(out.pages===1?'':'s')+'). Open it and press “Print or save as PDF” to print on A4 landscape.','ok');
  }).catch(e=>{
    const c=e&&e.code;
    if(c==='declined') say('Download cancelled.','');
    else if(c==='host_unavailable') say('This app cannot save files. Open the page in a browser or on a computer to download.','bad');
    else say('The file could not be saved ('+(c||'error')+').','bad');
  });
}

function saveTeacher(){
  const name=draft.name.trim();
  if(!name){say('Type the teacher’s name first.','bad');const i=$('tname');if(i)i.focus();return;}
  if(S.teachers.some(t=>t.id!==draft.editId&&t.name.toLowerCase()===name.toLowerCase())){say('A teacher called “'+name+'” is already registered. Use a different name, or edit the existing teacher.','bad');return;}
  const picks=Object.keys(draft.picks).filter(k=>draft.picks[k]);
  if(!picks.length){say('Tick at least one learning area and class for this teacher.','bad');return;}
  let t;
  if(draft.editId){
    t=tById(draft.editId);t.name=name;
    Object.keys(S.assign).forEach(a=>Object.keys(S.assign[a]).forEach(c=>{if(S.assign[a][c]===t.id) delete S.assign[a][c];}));
  }else{t={id:'t'+uid(),no:S.nextNo++,name};S.teachers.push(t);}
  picks.forEach(k=>{const p=k.split('|');(S.assign[p[0]]=S.assign[p[0]]||{})[p[1]]=t.id;});
  const wasEdit=!!draft.editId;
  draft={editId:null,name:'',picks:{}};
  refresh();
  say((wasEdit?'Updated ':'Saved ')+name+' as teacher no. '+t.no+' with '+picks.length+' class allocation'+(picks.length===1?'':'s')+'. Add the next teacher, or press Generate timetables when everyone is in.','ok');
  const i=$('tname');if(i)i.focus();
}

/* ---- actions ---- */
function actGenerate(){
  generate();syncWaiting();issues=detect();
  const w=S.waiting.length;
  refresh();
  const none=S.areas.length*CLASSES.length-S.areas.reduce((n,a)=>n+CLASSES.filter(c=>teacherOf(a.id,c.k)).length,0);
  const dg=diagnose();
  let t=w?'Timetables generated. '+w+' lesson'+(w>1?'s':'')+' could not be placed and are in the waiting room.'+(dg.length?' Reason: '+dg.join(' ')+' Share some of these classes with another teacher in Register teachers, then press Generate again.':' Press Generate timetables once more, or share these classes between more teachers in Register teachers.'):'Timetables generated for all six classes: every lesson is placed, the waiting room is empty and there are no collisions.';
  if(none) t+=' '+none+' learning-area slot'+(none>1?'s have':' has')+' no teacher yet; see Register teachers.';
  say(t,w?'bad':'ok');
}
function actDetect(){
  syncWaiting();issues=detect();refresh();
  const n=issues.length;
  say(n?n+' collision'+(n>1?'s':'')+' found. They are marked in red and listed on the right.':'No collisions found.',n?'bad':'ok');
  $('issuesCard').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function actSolve(){
  const l=autoSolve();touch();refresh();
  let t;
  if(!l.before&&!l.placed&&!l.waitingNow) t='Nothing to solve: no collisions and nothing in the waiting room.';
  else{
    t='Resolved '+l.before+' collision'+(l.before===1?'':'s')+' ('+l.moved+' lesson'+(l.moved===1?'':'s')+' moved, '+l.dropped+' sent to the waiting room).';
    if(l.placed) t+=' '+l.placed+' waiting lesson'+(l.placed===1?'':'s')+' placed.';
    if(l.waitingNow){const dg=diagnose();t+=' '+l.waitingNow+' still waiting.'+(dg.length?' Reason: '+dg.join(' '):' The teachers have no free period that fits. Share those classes between more teachers in Register teachers, then run Auto-solve again.');}
  }
  say(t,l.waitingNow?'bad':'ok');
}
function place(cls,d,p){
  if(!sel||sel.cls!==cls) return;
  const it=S.waiting.find(w=>w.cls===sel.cls&&w.a===sel.a&&w.kind===sel.kind);if(!it){sel=null;refresh();return;}
  if(sel.kind==='double'){
    let s=-1;
    if(DOUBLE_STARTS.includes(p)&&!S.tt[cls][d][p]&&!S.tt[cls][d][p+1]) s=p;
    else if(DOUBLE_STARTS.includes(p-1)&&!S.tt[cls][d][p-1]&&!S.tt[cls][d][p]) s=p-1;
    if(s<0){say('A double lesson needs two free periods in a row: P1–2, P3–4, P5–6 or P7–8.','bad');return;}
    putDouble(cls,sel.a,d,s);
  }else{
    if(S.tt[cls][d][p]) return;
    putSingle(cls,sel.a,d,p);
  }
  S.waiting=S.waiting.filter(w=>w.id!==it.id);
  if(!S.waiting.some(w=>w.cls===sel.cls&&w.a===sel.a&&w.kind===sel.kind)) sel=null;
  touch();issues=detect();refresh();
  say(issues.length?'Placed, but it creates a collision. Use Auto-solve to fix it.':'Placed.',issues.length?'bad':'ok');
}
function rowSelect(a,g){
  const cells=CLASSES.filter(c=>(g===0||gradeOf(c.k)===g)&&(!teacherOf(a,c.k)||teacherOf(a,c.k)===draft.editId));
  if(!cells.length) return;
  const all=cells.every(c=>draft.picks[a+'|'+c.k]);
  cells.forEach(c=>{draft.picks[a+'|'+c.k]=!all;});
  renderMain();
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el) return;
  const a=el.dataset.act;
  if(a==='dl') return doDownload(el.dataset.kind,el.dataset.arg);
  if(a==='generate') return actGenerate();
  if(a==='detect') return actDetect();
  if(a==='solve') return actSolve();
  if(a==='tab'){view=el.dataset.v;armed=null;return renderMain();}
  if(a==='cls'){curCls=el.dataset.cls;return renderMain();}
  if(a==='tch'){curTeacher=el.dataset.t;return renderMain();}
  if(a==='pick'){
    const same=sel&&sel.cls===el.dataset.cls&&sel.a===el.dataset.a&&sel.kind===el.dataset.kind;
    sel=same?null:{cls:el.dataset.cls,a:el.dataset.a,kind:el.dataset.kind};
    if(sel){curCls=sel.cls;view='class';}
    renderMain();renderSide();return;
  }
  if(a==='cell') return place(el.dataset.cls,+el.dataset.d,+el.dataset.p);
  if(a==='drop'){dropToWaiting(el.dataset.cls,+el.dataset.d,+el.dataset.p);touch();refresh();return say('Lesson sent to the waiting room.','');}
  if(a==='goto'){
    const i=issues[+el.dataset.n];if(!i) return;
    const c=i.cells[0];curCls=c.cls;view='class';renderMain();
    const t=document.querySelector('[data-key="'+c.cls+'|'+c.d+'|'+c.p+'"]')||document.querySelector('[data-key="'+c.cls+'|'+c.d+'|'+(c.p-1)+'"]');
    if(t){t.classList.add('flash');t.scrollIntoView({block:'center',behavior:'smooth'});}
    return;
  }
  if(a==='saveT') return saveTeacher();
  if(a==='cancelT'){draft={editId:null,name:'',picks:{}};renderMain();return say('','');}
  if(a==='rowsel') return rowSelect(el.dataset.a,+el.dataset.g);
  if(a==='editT'){
    const t=tById(el.dataset.t);if(!t) return;
    draft={editId:t.id,name:t.name,picks:{}};
    S.areas.forEach(ar=>CLASSES.forEach(c=>{if(teacherOf(ar.id,c.k)===t.id) draft.picks[ar.id+'|'+c.k]=true;}));
    renderMain();$('mainCard').scrollIntoView({block:'start',behavior:'smooth'});return;
  }
  if(a==='rmT'){
    const k='rmT'+el.dataset.t;
    if(armed!==k){armed=k;return renderMain();}
    armed=null;const id=el.dataset.t;
    Object.keys(S.assign).forEach(ar=>Object.keys(S.assign[ar]).forEach(c=>{if(S.assign[ar][c]===id) delete S.assign[ar][c];}));
    S.teachers=S.teachers.filter(t=>t.id!==id);
    if(draft.editId===id) draft={editId:null,name:'',picks:{}};
    refresh();return say('Teacher removed. Their classes now have no teacher; allocate them to someone else.','');
  }
  if(a==='addarea'){
    const id='a'+uid();S.areas.push({id,name:'New learning area',short:'NEW',type:'daily',per:5,hue:HUES[S.areas.length%HUES.length]});
    S.assign[id]={};
    refreshQuiet();renderMain();return say('Learning area added. Allocate teachers in Register teachers, then run Generate or Auto-solve.','ok');
  }
  if(a==='rmarea'){
    const k='rm'+el.dataset.a;
    if(armed!==k){armed=k;return renderMain();}
    armed=null;S.areas=S.areas.filter(x=>x.id!==el.dataset.a);delete S.assign[el.dataset.a];
    Object.keys(draft.picks).forEach(p=>{if(p.split('|')[0]===el.dataset.a) delete draft.picks[p];});
    refreshQuiet();renderMain();return say('Learning area removed.','');
  }
  if(a==='reset'){
    if(armed!=='reset'){armed='reset';return renderMain();}
    armed=null;S=defaultState();generate();sel=null;draft={editId:null,name:'',picks:{}};refresh();return say('Defaults restored. Register your teachers again, then press Generate timetables.','ok');
  }
});

    CLASSES.forEach(c=>S.tt[c.k].forEach((day,d)=>day.forEach((x,p)=>{if(x&&x.a===a.id)S.tt[c.k][d][p]=null;})));
    S.waiting=S.waiting.filter(w=>w.a!==a.id);
    refreshQuiet();renderMain();say(a.name+' now has '+nw+' periods a week. Its lessons were reset; run Auto-solve collisions to place them.','');return;
  }
  if(el.dataset.f!=='type') return;
  const a=areaById(el.dataset.a);a.type=el.value;a.per=perOf(a);
  CLASSES.forEach(c=>S.tt[c.k].forEach((day,d)=>day.forEach((x,p)=>{if(x&&x.a===a.id)S.tt[c.k][d][p]=null;})));
  S.waiting=S.waiting.filter(w=>w.a!==a.id);
  refreshQuiet();renderMain();say('Pattern changed for '+a.name+'. Its lessons are in the waiting room; run Auto-solve to place them.','');
});
[1,2].forEach(n=>{const inp=$('file'+n);inp.addEventListener('change',e=>{const f=inp.files&&inp.files[0];handleLogo(n,f,()=>{try{inp.value='';}catch(_){}});});});
$('ttitle').addEventListener('input',e=>{S.title=e.target.value;save();renderMain();});

/* ---- start ---- */
/* When the page is opened as a plain file (no Claude viewer), save files with an ordinary download link. */
function fallbackDl(){
  return {save:function(r){
    const blob=new Blob([r.data],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=r.filename;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
    return Promise.resolve({status:'saved'});
  }};
}
(function init(){
  dl=fallbackDl();
  if(!load()){S=defaultState();generate();}
  S.ver=4;
  if(!S.generatedAt) S.generatedAt=new Date().toISOString();
  const st=document.createElement('style');st.textContent=SHEET_CSS;document.head.appendChild(st);
  window.addEventListener('resize',fitSheets);
  syncWaiting();
  if(migrated){autoSolve();if(S.waiting.length){generate();syncWaiting();}}
  $('ttitle').value=S.title||'';
  refresh();
  if(migrated) say('Updated: lessons per week now follow your list (40 periods for every stream). Your teachers are kept and the new lessons have been placed.','ok');
  else say(S.teachers.length?'':'No teachers registered yet. Open Register teachers, add each teacher and their classes, then press Generate timetables.','');
  renderBar();
  try{if(window.claude&&window.claude.use) window.claude.use('downloads').then(d=>{if(d){dl=d;dlViaCap=true;renderBar();renderMain();}}).catch(()=>{});}catch(e){}
})();

</script>
